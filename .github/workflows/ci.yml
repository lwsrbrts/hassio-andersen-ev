name: CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.15.0
      - name: Check with ruff
        run: ruff check --config custom_components/andersen_ev/ruff.toml custom_components/andersen_ev
      - name: Check formatting with ruff
        run: ruff format --check --config custom_components/andersen_ev/ruff.toml custom_components/andersen_ev

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # litellm ships a Rust/PyO3 native build (pulled transitively via
    # homeassistant -> hass-nabucasa) whose PyO3 has no Python 3.14 support yet,
    # so the 3.14 install fails at the native build. Build against the stable ABI
    # instead. Remove once litellm publishes 3.14-compatible wheels.
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt
      - name: Test with pytest
        run: uv run pytest --cov=custom_components/andersen_ev --cov-report=term-missing --cov-report=xml

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    # continue-on-error until requirements in manifest.json are pinned (B5)
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master @ f4ca6f6 (2026-06-22)

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt
      - name: Run mypy
        run: uv run mypy custom_components/andersen_ev

  ci-success:
    name: CI Success
    # Stable required-status-check target: its name never changes when the
    # test matrix changes, so branch protection can require this one context.
    # Tighten later (e.g. add hassfest at B5) by extending `needs` + the check.
    if: ${{ always() }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "A required job did not succeed (lint=${{ needs.lint.result }}, test=${{ needs.test.result }})"
            exit 1
          fi
          echo "All required jobs succeeded"
