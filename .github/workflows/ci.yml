name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.15.0
      - name: Check with ruff
        run: ruff check --config custom_components/andersen_ev/ruff.toml custom_components/andersen_ev
      - name: Check formatting with ruff
        run: ruff format --check --config custom_components/andersen_ev/ruff.toml custom_components/andersen_ev

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv pip install pytest pytest-asyncio pytest-cov -r requirements.txt
      - name: Test with pytest
        run: uv run pytest --cov=custom_components/andersen_ev --cov-report=term-missing --cov-report=xml

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    # continue-on-error until requirements in manifest.json are pinned (B5)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  ci-success:
    name: CI Success
    # Stable required-status-check target: its name never changes when the
    # test matrix changes, so branch protection can require this one context.
    # Tighten later (e.g. add hassfest at B5) by extending `needs` + the check.
    if: ${{ always() }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "A required job did not succeed (lint=${{ needs.lint.result }}, test=${{ needs.test.result }})"
            exit 1
          fi
          echo "All required jobs succeeded"
